services:
  - type: web
    name: agent-rh-worker
    runtime: python
    pythonVersion: "3.11"
    rootDir: worker
    startCommand: "playwright install chromium --with-deps && uvicorn main:app --host 0.0.0.0 --port 8000"
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && playwright install chromium --with-deps"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
